name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (offline, no credentials)
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q src main.py scrappa_cli.py
